[package]
name = "mango-local-task-kit"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.105"
axum = "=0.8.9"
hex = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono"] }
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
base64 = "=0.22.1"
bs58 = "=0.5.1"
sha3 = "=0.10.6"
